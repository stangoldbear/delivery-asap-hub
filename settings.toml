# ─────────────────────────────────────────────────────────────────────────────
# Delivery ASAP hub — deployment settings
#
# Everything an organisation needs to change lives here: no Python edit needed
# to add a tier, a role, a team member or a project code.
# Copy to settings.local.toml (git-ignored) to override without touching this
# file, or pass --settings PATH.
# ─────────────────────────────────────────────────────────────────────────────

[app]
title    = "Delivery ASAP hub"
subtitle = "Mobile Delivery — Unified View & Control Center"
owner    = "Unassigned"          # shown as "DM:" in the header
footer   = "Delivery ASAP hub — local second brain"

[server]
host = "127.0.0.1"               # loopback by default; the write API is unauthenticated
port = 8080

[vault]
# Paths are resolved relative to the repository root unless absolute.
root     = ".knowledge"
projects = "02-projects/active"
plan     = "03-delivery-patterns/delivery-plan.md"

[links]
jira_base_url          = "https://jira.example.com/browse/"
jira_placeholder       = "e.g. NIMBUS-1042"
confluence_placeholder = "https://confluence.example.com/display/..."
figma_placeholder      = "https://www.figma.com/design/..."

[timeline]
# Extend the chart at least up to this date, even when no task reaches it.
min_end = 2026-12-31

[locale]
months = ["January", "February", "March", "April", "May", "June",
          "July", "August", "September", "October", "November", "December"]
month_abbr = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
              "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"]

[defaults]
tier = "tier-3"                  # used when a card declares an unknown tier
# Platforms offered as toggles in the detail panel.
platforms = ["iOS", "Android", "Backend (dev)", "Backend (config)", "Content", "QA"]
# Colour for timeline rows that match no role, and for time-off ("done") tasks.
fallback_role  = { label = "Member", color = "#78909c" }
time_off_color = "#ef5350"

# ─── Tiers: rendering order = declaration order ──────────────────────────────
# The last entry is the bucket for timeline tasks not linked to any project.
[[tiers]]
key   = "tier-1"
title = "TIER 1 — CORE & COMPLIANCE (HIGH PRIORITY)"
rgb   = [211, 47, 47]

[[tiers]]
key   = "tier-2"
title = "TIER 2 — IMPORTANT & STRATEGIC"
rgb   = [245, 124, 0]

[[tiers]]
key   = "tier-3"
title = "TIER 3 — SUPPORT & MINOR"
rgb   = [67, 160, 71]

[[tiers]]
key   = "other"
title = "OPERATIONAL & TEAM TIME OFF"
rgb   = [97, 97, 97]

# ─── Roles ───────────────────────────────────────────────────────────────────
# `squads` below assigns a role explicitly per member; `roles` is only the
# fallback for timeline rows with no matching member (keyword search).
[[roles]]
key      = "backend"
label    = "Backend Dev"
color    = "#1e88e5"
keywords = ["Backend", "Server"]

[[roles]]
key      = "ios"
label    = "iOS Dev"
color    = "#1e88e5"
keywords = ["iOS"]

[[roles]]
key      = "android"
label    = "Android Dev"
color    = "#1e88e5"
keywords = ["Android"]

[[roles]]
key      = "qa"
label    = "QA"
color    = "#ffb300"
keywords = ["QA", "Test"]

[[roles]]
key      = "content"
label    = "Content"
color    = "#ab47bc"
keywords = ["Content", "UX"]

[[roles]]
key      = "pm"
label    = "PM / DM"
color    = "#78909c"
keywords = ["PM", "Delivery Manager"]

# ─── Squads: timeline label prefix → person, with an explicit role ───────────
# The `section` key must match the `section` line of the Gantt plan.
[[squads]]
section = "Backend"
members = [
  { prefix = "Backend Dev #1", name = "Ada Lovelace",     role = "backend" },
  { prefix = "Backend Dev #2", name = "Grace Hopper",     role = "backend" },
  { prefix = "Backend Dev #3", name = "Alan Turing",      role = "backend" },
]

[[squads]]
section = "iOS"
members = [
  { prefix = "iOS Dev #1", name = "Rita Levi",       role = "ios" },
  { prefix = "iOS Dev #2", name = "Enrico Fermi",    role = "ios" },
  { prefix = "iOS Dev #3", name = "Nikola Tesla",    role = "ios" },
  { prefix = "iOS Dev #4", name = "Hedy Lamarr",     role = "ios" },
]

[[squads]]
section = "Android"
members = [
  { prefix = "Android Dev #1", name = "Katherine Johnson", role = "android" },
  { prefix = "Android Dev #2", name = "Linus Pauling",     role = "android" },
  { prefix = "Android Dev #3", name = "Barbara McClintock", role = "android" },
  { prefix = "Android Dev #4", name = "Kip Thorne",        role = "android" },
]

[[squads]]
section = "QA & PM"
members = [
  { prefix = "QA #1",            name = "Margaret Hamilton", role = "qa" },
  { prefix = "QA #2",            name = "Jean Bartik",       role = "qa" },
  { prefix = "PM #1",            name = "Mary Jackson",      role = "pm" },
  { prefix = "Delivery Manager", name = "Unassigned",        role = "pm" },
]

# ─── Short code used in the Gantt plan → project card id ─────────────────────
[project_codes]
P1  = "project-1-navigation-menu"
P2  = "project-2-eco-labels"
P3  = "project-3-home-redesign"
P4  = "project-4-analytics-migration"
P5  = "project-5-carrier-tracking"
P6  = "project-6-designer-name"
P7  = "project-7-menu-endpoint"
P8  = "project-8-banner-defaults"
P9  = "project-9-store-credit"
P10 = "project-10-delivery-estimate"
P11 = "project-11-checkout-hardening"
P12 = "project-12-accessibility-audit"
